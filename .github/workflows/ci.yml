name: CI

on: [push, pull_request]

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }

      # 第 0 道:尺自己要先被驗過。
      # 一支從不亮紅燈的檢查,跟沒有檢查是同一件事。
      - name: 靜態檢查的自我測試
        run: sh scripts/self-test.sh

      - run: npm ci

      # 第 1 道:靜態規則(測試永遠不會為它們變紅)
      - name: 金額路徑零浮點
        run: npm run check:money
      - name: 時間必須是參數
        run: npm run check:time
      - name: 簽章常數時間比對
        run: npm run check:jwt

      # 第 2 道:單元與契約
      - name: 測試
        run: npm test

      # 第 3 道:併發要重跑,單次通過不算
      - name: 併發(重跑 5 次)
        run: for i in 1 2 3 4 5; do npm run test:race || exit 1; done
